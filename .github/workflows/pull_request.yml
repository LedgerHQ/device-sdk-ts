name: "[Checks] Pull Request"
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches-ignore:
      - main

env:
  FORCE_COLOR: "1"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'develop' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-assign:
    name: Auto assign
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - uses: toshimaru/auto-author-assign@3e19bfc990cb1cf0589dce95e9f75289bb1e22de # v3.0.3

  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-22.04
    outputs:
      context-module: ${{ steps.filter.outputs.context-module }}
      signer-eth: ${{ steps.filter.outputs.signer-eth }}
      signer-solana: ${{ steps.filter.outputs.signer-solana }}
      signer-utils: ${{ steps.filter.outputs.signer-utils }}
      solana-tools: ${{ steps.filter.outputs.solana-tools }}
      cs-tester: ${{ steps.filter.outputs.cs-tester }}
      should-run-ethereum-cs-tester: ${{ steps.filter.outputs.signer-eth == 'true' || steps.filter.outputs.context-module == 'true' || steps.filter.outputs.signer-utils == 'true' || steps.filter.outputs.cs-tester == 'true' }}
      should-run-solana-cs-tester: ${{ steps.filter.outputs.signer-solana == 'true' || steps.filter.outputs.context-module == 'true' || steps.filter.outputs.signer-utils == 'true' || steps.filter.outputs.cs-tester == 'true' || steps.filter.outputs.solana-tools == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            context-module:
              - 'packages/signer/context-module/**'
            signer-eth:
              - 'packages/signer/signer-eth/**'
            signer-solana:
              - 'packages/signer/signer-solana/**'
            signer-utils:
              - 'packages/signer/signer-utils/**'
            solana-tools:
              - 'packages/tools/solana-tools/**'
            cs-tester:
              - 'apps/clear-signing-tester/**'
              - '.github/**'

  setup:
    name: Setup toolchain and dependencies
    runs-on: ${{ !github.event.pull_request.head.repo.fork && 'ledgerhq-device-sdk' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: LedgerHQ/device-sdk-ts/.github/actions/setup-with-cache-composite@b83ec5020b992dcc53f683830e0abd2e147791ae

  danger:
    name: Run Danger check
    needs: [setup]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: LedgerHQ/device-sdk-ts/.github/actions/setup-with-cache-composite@b83ec5020b992dcc53f683830e0abd2e147791ae

      - name: Danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workaround when using custom runners
          # https://github.com/danger/danger-js/issues/1374
          DANGER_GITHUB_API_BASE_URL: "https://api.github.com"
        run: pnpm danger:ci

  checks:
    name: Checks (build, prettier, lint, typecheck, test)
    # Single job running each Turbo task as its own step. Because everything
    # runs on one runner, build output stays on disk between steps, so there is
    # no cross-job build-cache upload/download. `--affected` restricts every
    # task to the packages changed versus the PR base branch.
    needs: [setup]
    runs-on: ${{ !github.event.pull_request.head.repo.fork && 'ledgerhq-device-sdk' || 'ubuntu-22.04' }}
    env:
      # Base reference used by `turbo run --affected` to detect changed packages.
      TURBO_SCM_BASE: origin/${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history + the base branch are required so Turbo can compute the
          # merge-base for `--affected`.
          fetch-depth: 0

      - name: Fetch base branch for --affected
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - uses: LedgerHQ/device-sdk-ts/.github/actions/setup-with-cache-composite@b83ec5020b992dcc53f683830e0abd2e147791ae

      - name: Build
        id: build
        run: pnpm turbo run build --affected

      - name: Prettier
        id: prettier
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm turbo run prettier --affected

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm turbo run lint --affected

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm turbo run typecheck --affected

      - name: Test
        id: test
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm turbo run test:coverage --affected

      - uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
        if: ${{ steps.test.outcome == 'success' && github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Report
        if: ${{ !cancelled() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PRETTIER_OUTCOME: ${{ steps.prettier.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              *)       echo "➖ ${1:-not run}" ;;
            esac
          }

          {
            echo "## Checks summary"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Build | $(icon "$BUILD_OUTCOME") |"
            echo "| Prettier | $(icon "$PRETTIER_OUTCOME") |"
            echo "| Lint | $(icon "$LINT_OUTCOME") |"
            echo "| Typecheck | $(icon "$TYPECHECK_OUTCOME") |"
            echo "| Test | $(icon "$TEST_OUTCOME") |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for outcome in "$BUILD_OUTCOME" "$PRETTIER_OUTCOME" "$LINT_OUTCOME" "$TYPECHECK_OUTCOME" "$TEST_OUTCOME"; do
            if [ "$outcome" = "failure" ]; then
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "One or more checks failed. See the summary above."
            exit 1
          fi
          echo "All checks passed."

  sample-integration:
    name: Run playwright
    needs: [checks]
    runs-on: ${{ !github.event.pull_request.head.repo.fork && 'ledgerhq-device-sdk' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: LedgerHQ/device-sdk-ts/.github/actions/setup-with-build-cache-composite@b83ec5020b992dcc53f683830e0abd2e147791ae

      - name: Install Playwright browsers
        run: pnpm --filter @ledgerhq/device-management-kit-sample exec playwright install --with-deps chromium

      - name: Run sample Playwright tests
        # The Playwright webServer (start-servers.sh) runs a production
        # `next build` and starts both the device mock server and the sample
        # app, so neither is launched here.
        run: pnpm --filter @ledgerhq/device-management-kit-sample test:playwright

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        with:
          name: sample-playwright-traces
          path: apps/sample/test-results
          if-no-files-found: ignore
          retention-days: 7

  health-check:
    name: Run health check
    # Aggregates the checks and integration jobs into a single required status so
    # branch protection only needs to require "Run health check".
    needs: [checks, sample-integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check results
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."

  cs-tester:
    needs: [checks, detect-changes]
    if: needs.detect-changes.outputs.should-run-ethereum-cs-tester == 'true'
    name: Ethereum Clear Signing Test (${{ matrix.device }} - ${{ matrix.test }})
    runs-on: ${{ !github.event.pull_request.head.repo.fork && 'ledgerhq-device-sdk' || 'ubuntu-22.04' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device: [stax, nanox]
        test:
          - test:raw:complete
          - test:raw:multisig
          - test:typed-data:multisig
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/cs-tester-composite
        with:
          runner: cs-tester
          test: ${{ matrix.test }}
          device: ${{ matrix.device }}
          coin-app: Ethereum
          artifact-prefix: eth-cs-tester-logs
          summary-prefix: "Ethereum Clear Signing Test"
          gh-bot-app-id: ${{ secrets.GH_BOT_APP_ID }}
          gh-bot-private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          gating-token: ${{ secrets.GATING_TOKEN }}
          solana-rpc-url: ${{ secrets.SOLANA_LEDGER_RPC_URL }}

  solana-cs-tester:
    needs: [checks, detect-changes]
    if: needs.detect-changes.outputs.should-run-solana-cs-tester == 'true'
    name: Solana Fixture Test (${{ matrix.device }} - ${{ matrix.test }})
    runs-on: ${{ !github.event.pull_request.head.repo.fork && 'ledgerhq-device-sdk' || 'ubuntu-22.04' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device: [stax, nanox]
        test:
          - test:solana:system-transfers
          - test:solana:spl-legacy
          - test:solana:spl-token2022
          - test:solana:stake
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/cs-tester-composite
        with:
          runner: cs-tester:solana
          test: ${{ matrix.test }}
          device: ${{ matrix.device }}
          coin-app: Solana
          artifact-prefix: solana-cs-tester-logs
          summary-prefix: "Solana Fixture Test"
          gh-bot-app-id: ${{ secrets.GH_BOT_APP_ID }}
          gh-bot-private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          gating-token: ${{ secrets.GATING_TOKEN }}
          solana-rpc-url: ${{ secrets.SOLANA_LEDGER_RPC_URL }}
