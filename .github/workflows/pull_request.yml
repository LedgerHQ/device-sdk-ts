name: "[Checks] Pull Request"
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches-ignore:
      - main

env:
  FORCE_COLOR: "1"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'develop' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-assign:
    name: Auto assign
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - uses: toshimaru/auto-author-assign@3e19bfc990cb1cf0589dce95e9f75289bb1e22de # v3.0.3

  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-22.04
    outputs:
      cs-scenarios: ${{ steps.select.outputs.scenarios }}
      sample: ${{ steps.filter.outputs.sample }}
      rn-hid-android: ${{ steps.filter.outputs.rn-hid-android }}
      # Untrusted code (fork PRs, and Dependabot PRs whose freshly released
      # dependencies may be malicious) runs on GitHub-hosted runners only, never
      # on our self-hosted runners. Dependabot PRs are matched by author, so
      # fixes pushed on them by Koda or a maintainer stay untrusted too.
      untrusted: ${{ github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]' }}
      runner: ${{ (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-22.04' || 'ledgerhq-device-sdk' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            context-module:
              - 'packages/signer/context-module/**'
            signer-eth:
              - 'packages/signer/signer-eth/**'
            signer-solana:
              - 'packages/signer/signer-solana/**'
            signer-trx:
              - 'packages/signer/signer-trx/**'
            signer-utils:
              - 'packages/signer/signer-utils/**'
            signer-btc-legacy:
              - 'packages/signer/signer-btc-legacy/**'
            solana-tools:
              - 'packages/tools/solana-tools/**'
            contacts-kit:
              - 'packages/device-contacts-kit/**'
            cs-tester:
              - 'apps/clear-signing-tester/**'
              - '.github/actions/cs-tester-composite/**'
              - '.github/actions/setup-composite/**'
              - '.github/workflows/pull_request.yml'
            # Any package can be a dependency of the apps: the e2e jobs then
            # ask Turbo whether their app is really affected.
            sample:
              - 'apps/sample/**'
              - 'apps/device-mock-server/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/actions/sample-e2e-composite/**'
              - '.github/actions/setup-composite/**'
              - '.github/workflows/pull_request.yml'
            rn-hid-android:
              - 'packages/transport/rn-hid/android/**'
              - '.github/actions/setup-composite/**'
              - '.github/workflows/pull_request.yml'

      - name: Select clear-signing groups
        id: select
        env:
          # The tester, its CI files, and the packages every signer shares can
          # affect any group.
          ALL: ${{ steps.filter.outputs.cs-tester == 'true' || steps.filter.outputs.context-module == 'true' || steps.filter.outputs.signer-utils == 'true' }}
          # Contacts sign through the eth signer, and a stored contact changes
          # what the eth review screens display, so the two move together.
          ETH_SIDE: ${{ steps.filter.outputs.signer-eth == 'true' || steps.filter.outputs.contacts-kit == 'true' }}
          SOLANA_SIDE: ${{ steps.filter.outputs.signer-solana == 'true' || steps.filter.outputs.solana-tools == 'true' }}
          # Tron signs contacts too, so the kit moves the Tron group as well.
          TRON_SIDE: ${{ steps.filter.outputs.signer-trx == 'true' || steps.filter.outputs.contacts-kit == 'true' }}
          BTC_LEGACY_SIDE: ${{ steps.filter.outputs.signer-btc-legacy == 'true' }}
        run: |
          if [ "$ALL" = "true" ]; then
            scenarios="core contacts safe solana solana-general-clear-sign tron btc-legacy"
          else
            scenarios=""
            if [ "$ETH_SIDE" = "true" ]; then
              scenarios="$scenarios core contacts safe"
            fi
            if [ "$SOLANA_SIDE" = "true" ]; then
              scenarios="$scenarios solana solana-general-clear-sign"
            fi
            if [ "$TRON_SIDE" = "true" ]; then
              scenarios="$scenarios tron"
            fi
            if [ "$BTC_LEGACY_SIDE" = "true" ]; then
              scenarios="$scenarios btc-legacy"
            fi
            scenarios="${scenarios# }"
          fi

          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          echo "clear-signing groups: ${scenarios:-<none>}"

  danger:
    name: Run Danger check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-composite

      - name: Danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workaround when using custom runners
          # https://github.com/danger/danger-js/issues/1374
          DANGER_GITHUB_API_BASE_URL: "https://api.github.com"
        run: pnpm danger:ci

  checks:
    name: Checks (build, prettier, lint, typecheck, test)
    # Single job running each Turbo task as its own step. Because everything
    # runs on one runner, build output stays on disk between steps, so there is
    # no cross-job build-cache upload/download. `--affected` restricts every
    # task to the packages changed versus the PR base branch.
    needs: [detect-changes]
    runs-on: ${{ needs.detect-changes.outputs.runner }}
    env:
      # Base reference used by `turbo run --affected` to detect changed packages.
      TURBO_SCM_BASE: origin/${{ github.event.pull_request.base.ref }}
      UNTRUSTED: ${{ needs.detect-changes.outputs.untrusted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + the base branch are required so Turbo can compute the
          # merge-base for `--affected`.
          fetch-depth: 0

      - name: Fetch base branch for --affected
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - uses: ./.github/actions/setup-composite

      - name: Build
        id: build
        run: pnpm turbo run build --affected

      - name: Prettier
        id: prettier
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm turbo run prettier --affected

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm turbo run lint --affected

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm turbo run typecheck --affected

      - name: Test
        id: test
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm turbo run test:coverage --affected

      - uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        # UNTRUSTED matches Dependabot PRs by author, so a maintainer's push to
        # one never exposes SONAR_TOKEN to the dependencies run in this job.
        if: ${{ steps.test.outcome == 'success' && env.UNTRUSTED != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Report
        if: ${{ !cancelled() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PRETTIER_OUTCOME: ${{ steps.prettier.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              *)       echo "➖ ${1:-not run}" ;;
            esac
          }

          {
            echo "## Checks summary"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Build | $(icon "$BUILD_OUTCOME") |"
            echo "| Prettier | $(icon "$PRETTIER_OUTCOME") |"
            echo "| Lint | $(icon "$LINT_OUTCOME") |"
            echo "| Typecheck | $(icon "$TYPECHECK_OUTCOME") |"
            echo "| Test | $(icon "$TEST_OUTCOME") |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for outcome in "$BUILD_OUTCOME" "$PRETTIER_OUTCOME" "$LINT_OUTCOME" "$TYPECHECK_OUTCOME" "$TEST_OUTCOME"; do
            if [ "$outcome" = "failure" ]; then
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "One or more checks failed. See the summary above."
            exit 1
          fi
          echo "All checks passed."

  rn-hid-android-tests:
    name: RN HID Android unit tests
    # The turbo `test` task runs only the TypeScript tests. This job runs the
    # Kotlin tests of the native module, when the native code changes.
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rn-hid-android == 'true'
    runs-on: ${{ needs.detect-changes.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-composite

      - name: Set Up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "zulu"
          java-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      # The module builds only inside an app build: on its own, Gradle cannot
      # find React Native. The mobile sample app links it from node_modules.
      - name: Run Kotlin unit tests
        working-directory: ./apps/mobile/android
        run: ./gradlew :ledgerhq_device-transport-kit-react-native-hid:testDebugUnitTest

  health-check:
    name: Run health check
    # Aggregates the checks into a single required status so branch protection
    # only needs to require "Run health check". `!cancelled()` is what lets a
    # skipped cs-tester or rn-hid-android-tests through instead of skipping
    # this too.
    needs: [detect-changes, checks, sample-e2e, cs-tester, rn-hid-android-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check results
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."

  cs-tester:
    # Runs alongside `checks`, not after it: the composite builds its own
    # dependency chain, so it never consumed anything `checks` produced.
    needs: [detect-changes]
    # Needs Speculinho and GATING_TOKEN: skipped for untrusted PRs (see checks).
    if: needs.detect-changes.outputs.cs-scenarios != '' && !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]'
    name: Clear Signing Test (${{ matrix.device }})
    runs-on: ledgerhq-device-sdk
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device: [stax, nanox, flex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A scenario that does not support the device is skipped by name, so one
      # selection serves all three: contacts is flex-only, core is Nano and Stax.
      - uses: ./.github/actions/cs-tester-composite
        with:
          scenarios: ${{ needs.detect-changes.outputs.cs-scenarios }}
          device: ${{ matrix.device }}
          # One job now carries what three did, so it holds more emulators at
          # once to keep the wall clock where it was.
          concurrency: "10"
          artifact-prefix: cs-tester-logs
          summary-prefix: "Clear Signing Test"
          # A device registration flow is hard to diagnose from a bare log.
          enable-file-logging: "true"
          gating-token: ${{ secrets.GATING_TOKEN }}

  sample-e2e:
    name: Sample e2e (Playwright)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.sample == 'true'
    runs-on: ${{ needs.detect-changes.outputs.runner }}
    env:
      TURBO_SCM_BASE: origin/${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch base branch for --affected
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - uses: ./.github/actions/setup-composite

      - uses: ./.github/actions/sample-e2e-composite
        with:
          untrusted: ${{ needs.detect-changes.outputs.untrusted }}
          # Untrusted PRs do not use Speculinho, so they never get the token.
          gating-token: ${{ needs.detect-changes.outputs.untrusted != 'true' && secrets.GATING_TOKEN || '' }}
