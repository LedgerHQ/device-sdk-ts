name: "[Tests] Solana Nightly"
on:
  schedule:
    # Run every day at 3:00 AM UTC (offset from Ethereum/ERC7730 nightly at 2:00 AM)
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  FORCE_COLOR: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup toolchain and dependencies
    runs-on: ledgerhq-device-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: LedgerHQ/device-sdk-ts/.github/actions/setup-with-cache-composite@69b58c7fd3370397e82e73047b1441667bd46386

  build-libraries:
    name: Build libraries
    needs: [setup]
    runs-on: ledgerhq-device-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: LedgerHQ/device-sdk-ts/.github/actions/setup-with-build-cache-composite@69b58c7fd3370397e82e73047b1441667bd46386

  cs-tester:
    needs: [build-libraries]
    name: Solana Clear Signing Test (${{ matrix.device }})
    runs-on: ledgerhq-device-sdk
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device: [stax, nanox, flex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Fixtures only: the solana-programs scenarios are disabled, since an
      # RPC-derived case carries no expectedTexts and so cannot fail the
      # clear-signing check.
      - uses: ./.github/actions/cs-tester-composite
        with:
          scenarios: solana
          device: ${{ matrix.device }}
          concurrency: "10"
          log-level: error
          enable-file-logging: "true"
          artifact-prefix: solana-nightly-logs
          summary-prefix: "Solana Clear Signing Test"
          gating-token: ${{ secrets.GATING_TOKEN }}

  notify:
    name: Notify Slack
    needs: [cs-tester]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/slack-notify-composite
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          results: ${{ join(needs.*.result, ',') }}
