name: "[Tests] Solana Nightly"
on:
  schedule:
    # Run every day at 3:00 AM UTC (offset from Ethereum/ERC7730 nightly at 2:00 AM)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      details:
        description: "Extra line for the Slack notification"
        required: false
        default: ""

env:
  FORCE_COLOR: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cs-tester:
    name: Solana Clear Signing Test (${{ matrix.device }})
    runs-on: ledgerhq-device-sdk
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device: [stax, nanox, flex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/cs-tester-composite
        with:
          scenarios: solana solana-general-clear-sign solana-programs
          device: ${{ matrix.device }}
          concurrency: "10"
          log-level: error
          enable-file-logging: "true"
          artifact-prefix: solana-nightly-logs
          summary-prefix: "Solana Clear Signing Test"
          gating-token: ${{ secrets.GATING_TOKEN }}
          solana-rpc-url: ${{ secrets.SOLANA_LEDGER_RPC_URL }}

  # The seed is a secret of the develop-only solana-tx-check environment, which
  # would fail the job on any other branch (e.g. a version bump's).
  cs-tester-transaction-check:
    name: Solana Transaction Check Test (${{ matrix.device }})
    if: github.ref == 'refs/heads/develop'
    runs-on: ledgerhq-device-sdk
    environment: solana-tx-check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device: [stax, flex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/cs-tester-composite
        with:
          scenarios: solana-transaction-check
          device: ${{ matrix.device }}
          concurrency: "10"
          log-level: error
          enable-file-logging: "true"
          artifact-prefix: solana-transaction-check-nightly-logs
          summary-prefix: "Solana Transaction Check Test"
          gating-token: ${{ secrets.GATING_TOKEN }}
          speculos-seed: ${{ secrets.SPECULOS_SEED }}

  notify:
    name: Notify Slack
    needs: [cs-tester, cs-tester-transaction-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/slack-notify-composite
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          results: ${{ join(needs.*.result, ',') }}
          details: ${{ inputs.details }}
