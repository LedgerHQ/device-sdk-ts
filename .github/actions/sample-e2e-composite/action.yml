name: "Sample e2e"
description: "Build the sample app and run its Playwright tests when it is affected by the PR."

inputs:
  untrusted:
    description: "Fork or Dependabot PR: run against a local mock server, without Speculos"
    required: true
  gating-token:
    description: "Clear signing gating token, only passed for trusted PRs"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Detect if sample app is affected
      id: sample-affected
      shell: bash
      run: |
        affected=$(pnpm turbo run build --affected --dry=json 2>/dev/null \
          | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);console.log((j.packages||[]).includes("@ledgerhq/device-management-kit-sample")?"true":"false")}catch(e){console.log("true")}})')
        echo "affected=$affected" >> "$GITHUB_OUTPUT"
        echo "sample app affected: $affected"

    - name: Build sample app
      if: ${{ steps.sample-affected.outputs.affected == 'true' }}
      shell: bash
      run: pnpm turbo run build --filter=@ledgerhq/device-management-kit-sample...

    - name: Install Playwright browsers
      if: ${{ steps.sample-affected.outputs.affected == 'true' }}
      shell: bash
      run: pnpm --filter @ledgerhq/device-management-kit-sample exec playwright install --with-deps chromium

    # GitHub-hosted runners cannot reach the hosted mock server nor
    # Speculinho: untrusted PRs use a local mock server with no Speculos.
    - name: Start local mock server
      if: ${{ steps.sample-affected.outputs.affected == 'true' && inputs.untrusted == 'true' }}
      shell: bash
      run: |
        pnpm turbo run build --filter=@ledgerhq/device-mock-server
        SPECULINHO_URL= nohup pnpm --filter @ledgerhq/device-mock-server start > mock-server.log 2>&1 &
        timeout 60 sh -c 'until curl -sf http://127.0.0.1:9752/health; do sleep 1; done'

    - name: Run sample Playwright tests
      id: playwright
      # The Playwright webServer (start-servers.sh) starts the sample app.
      # Trusted PRs use the hosted mock server and its Speculos emulators.
      # Untrusted PRs use the local one and skip the specs tagged @speculos.
      if: ${{ steps.sample-affected.outputs.affected == 'true' }}
      shell: bash
      env:
        # Injected into the sample settings at runtime by the Playwright setup,
        # so the token is never built into the sample bundle.
        GATING_TOKEN: ${{ inputs.gating-token }}
        UNTRUSTED: ${{ inputs.untrusted }}
      run: |
        if [ "$UNTRUSTED" = "true" ]; then
          MOCK_SERVER_URL=http://127.0.0.1:9752 pnpm --filter @ledgerhq/device-management-kit-sample test:playwright --grep-invert @speculos
        else
          pnpm --filter @ledgerhq/device-management-kit-sample test:playwright
        fi

    # Playwright exits 0 once a retry passes, so uploading only on failure
    # loses the traces of flaky tests, which are the ones worth reading.
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: ${{ !cancelled() && steps.playwright.outcome != 'skipped' }}
      with:
        name: sample-playwright-traces
        path: apps/sample/test-results
        if-no-files-found: ignore
        retention-days: 7
