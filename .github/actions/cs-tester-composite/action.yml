name: "Clear Signing Tester"
description: "Run clear-signing scenarios for one device, in parallel across Speculinho emulators."

inputs:
  device:
    description: "Device the scenarios run on (stax, nanox, flex)"
    required: true
  scenarios:
    description: >-
      Space-separated selectors passed to `cli test`: groups, scenario names, or
      `all`. Scenarios that do not support the device are skipped.
    required: true
  concurrency:
    description: "How many scenarios may hold an emulator at once"
    required: false
    default: "6"
  log-level:
    description: "Console log level (omit to use the app default)"
    required: false
    default: ""
  enable-file-logging:
    description: "Write a log file per scenario, plus screenshots, and upload them"
    required: false
    default: "false"
  artifact-prefix:
    description: "Prefix for uploaded artifact names"
    required: true
  summary-prefix:
    description: "Prefix for GitHub step summary titles"
    required: true
  gating-token:
    description: "Clear signing gating token"
    required: true
  solana-rpc-url:
    description: "Solana RPC URL, required by the solana-programs group"
    required: false
    default: ""
  speculos-seed:
    description: "Emulator seed, required by the solana-transaction-check group"
    required: false
    default: ""
  cal-branch:
    description: >-
      CAL branch the scenarios read (`--cal-branch`): main, next or demo. Any
      branch but main runs in test mode, which starts the CAL signer in the job.
    required: false
    default: "main"
  cal-mode:
    description: >-
      CAL signature mode (`--cal-mode`): prod or test. Empty lets the CLI
      choose: test when cal-branch is not main, prod otherwise. Test mode
      starts the CAL signer in the job.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Resolves the mode the way the CLI does, so the signer runs exactly when the
    # tester needs it. At the defaults (main, empty) nothing below changes: no
    # signer, no new flags, and the same artifact and summary names.
    - name: Resolve CAL mode
      id: cal
      shell: bash
      env:
        INPUT_CAL_BRANCH: ${{ inputs.cal-branch }}
        INPUT_CAL_MODE: ${{ inputs.cal-mode }}
      run: |
        if [ "$INPUT_CAL_MODE" = "test" ] || { [ -z "$INPUT_CAL_MODE" ] && [ "$INPUT_CAL_BRANCH" != "main" ]; }; then
          echo "test-mode=true" >> "$GITHUB_OUTPUT"
        else
          echo "test-mode=false" >> "$GITHUB_OUTPUT"
        fi

        # Names a run off the default CAL setup, e.g. "next" or "main-test".
        label=""
        if [ "$INPUT_CAL_BRANCH" != "main" ] || [ -n "$INPUT_CAL_MODE" ]; then
          label="${INPUT_CAL_BRANCH}${INPUT_CAL_MODE:+-$INPUT_CAL_MODE}"
        fi
        echo "label=$label" >> "$GITHUB_OUTPUT"

    - uses: LedgerHQ/device-sdk-ts/.github/actions/setup-with-cache-composite@b83ec5020b992dcc53f683830e0abd2e147791ae

    # Test mode needs the sample's Python signer for the whole run: it serves the
    # staging-key certificates and re-signs metadata-service descriptors. It runs
    # from this checkout, on the sample image's Python version.
    - name: Set up Python for the CAL signer
      if: steps.cal.outputs.test-mode == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: apps/sample/requirements.txt

    - name: Start the CAL signer
      if: steps.cal.outputs.test-mode == 'true'
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONUNBUFFERED: "1"
      run: |
        SIGNER_URL="http://127.0.0.1:5328"
        SIGNER_LOG="/tmp/logs/cal-signer.log"
        mkdir -p /tmp/logs

        python -m pip install --progress-bar off -r apps/sample/requirements.txt gunicorn==23.0.0

        if curl -s -o /dev/null --max-time 2 "$SIGNER_URL/"; then
          echo "::error::Port 5328 is already in use, so the CAL signer cannot start."
          exit 1
        fi

        # The sample image's server (apps/sample/docker-entrypoint.sh), plus threads
        # because the tester runs up to `concurrency` cases against it at once.
        nohup gunicorn --chdir apps/sample --bind 127.0.0.1:5328 --workers 2 --threads 4 \
          --timeout 60 --access-logfile - api.index:app > "$SIGNER_LOG" 2>&1 &
        signer_pid=$!

        # /api/certificates calls CAL, so a 200 also proves CAL is reachable.
        deadline=$((SECONDS + 120))
        status=""
        until [ "$status" = "200" ]; do
          if ! kill -0 "$signer_pid" 2>/dev/null || [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::The CAL signer did not answer GET /api/certificates with 200 (last status: ${status:-none})."
            tail -n 50 "$SIGNER_LOG"
            exit 1
          fi
          sleep 2
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SIGNER_URL/api/certificates" || true)
        done

        echo "ERC7730_API_URL=$SIGNER_URL" >> "$GITHUB_ENV"
        echo "CAL signer ready at $SIGNER_URL"

    # Build only the clear-signing-tester dependency chain, cold. Avoids the
    # slow **/lib build-cache upload/download and the full build:libs.
    - name: Build clear-signing-tester dependencies
      shell: bash
      run: pnpm turbo run build --filter=@ledgerhq/clear-signing-tester...

    - name: Run scenarios
      shell: bash
      env:
        FORCE_COLOR: "0"
        GATING_TOKEN: ${{ inputs.gating-token }}
        INPUT_DEVICE: ${{ inputs.device }}
        INPUT_SCENARIOS: ${{ inputs.scenarios }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_LOG_LEVEL: ${{ inputs.log-level }}
        INPUT_ENABLE_FILE_LOGGING: ${{ inputs.enable-file-logging }}
        INPUT_SOLANA_RPC_URL: ${{ inputs.solana-rpc-url }}
        INPUT_CAL_BRANCH: ${{ inputs.cal-branch }}
        INPUT_CAL_MODE: ${{ inputs.cal-mode }}
        SPECULOS_SEED: ${{ inputs.speculos-seed }}
      run: |
        set -o pipefail
        mkdir -p /tmp/logs/screenshots

        ARGS=("--device" "$INPUT_DEVICE" "--concurrency" "$INPUT_CONCURRENCY")

        if [ -n "$INPUT_LOG_LEVEL" ]; then
          ARGS+=("--log-level" "$INPUT_LOG_LEVEL")
        fi

        # Passed only off their defaults, so default runs keep today's command line.
        if [ "$INPUT_CAL_BRANCH" != "main" ]; then
          ARGS+=("--cal-branch" "$INPUT_CAL_BRANCH")
        fi

        if [ -n "$INPUT_CAL_MODE" ]; then
          ARGS+=("--cal-mode" "$INPUT_CAL_MODE")
        fi

        if [ -n "$INPUT_SOLANA_RPC_URL" ]; then
          ARGS+=("--rpc-url" "$INPUT_SOLANA_RPC_URL")
        fi

        if [ "$INPUT_ENABLE_FILE_LOGGING" = "true" ]; then
          ARGS+=("--log-dir" "/tmp/logs")
          ARGS+=("--file-log-level" "debug")
          ARGS+=("--screenshot-folder-path" "/tmp/logs/screenshots")
        fi

        # Selectors are a space-separated list, so they must word-split.
        read -ra SELECTORS <<< "$INPUT_SCENARIOS"

        pnpm cs-tester cli test "${SELECTORS[@]}" "${ARGS[@]}" 2>&1 \
          | tee /tmp/cs-tester-output.log

    - name: Write job summary
      if: always()
      shell: bash
      env:
        INPUT_SUMMARY_PREFIX: ${{ inputs.summary-prefix }}
        INPUT_DEVICE: ${{ inputs.device }}
        INPUT_SCENARIOS: ${{ inputs.scenarios }}
        CAL_LABEL: ${{ steps.cal.outputs.label }}
      run: |
        {
          echo "## ${INPUT_SUMMARY_PREFIX}${CAL_LABEL:+ [CAL ${CAL_LABEL}]} (${INPUT_DEVICE} - ${INPUT_SCENARIOS})"
          echo ""
          if [ -f /tmp/cs-tester-output.log ]; then
            echo '```'
            sed -n '/SCENARIO RESULTS/,/^└/p' /tmp/cs-tester-output.log
            echo ""
            sed -n '/FAILED SCENARIOS/,/^$/p' /tmp/cs-tester-output.log
            sed -n '/RUN SUMMARY/,/^└/p' /tmp/cs-tester-output.log
            echo '```'
          else
            echo "No test output available"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Sanitise artifact name
      if: always()
      id: artifact
      shell: bash
      env:
        INPUT_ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        INPUT_DEVICE: ${{ inputs.device }}
        CAL_LABEL: ${{ steps.cal.outputs.label }}
      run: |
        name=$(echo "${INPUT_ARTIFACT_PREFIX}${CAL_LABEL:+-${CAL_LABEL}}-${INPUT_DEVICE}" | tr ':/ ' '-')
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: /tmp/logs/
        retention-days: 7
