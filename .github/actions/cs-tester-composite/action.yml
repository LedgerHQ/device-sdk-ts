name: "Clear Signing Tester"
description: "Run clear-signing scenarios for one device, in parallel across Speculinho emulators."

inputs:
  device:
    description: "Device the scenarios run on (stax, nanox, flex)"
    required: true
  scenarios:
    description: >-
      Space-separated selectors passed to `cli test`: groups, scenario names, or
      `all`. Scenarios that do not support the device are skipped.
    required: true
  concurrency:
    description: "How many scenarios may hold an emulator at once"
    required: false
    default: "6"
  log-level:
    description: "Console log level (omit to use the app default)"
    required: false
    default: ""
  enable-file-logging:
    description: "Write a log file per scenario, plus screenshots, and upload them"
    required: false
    default: "false"
  artifact-prefix:
    description: "Prefix for uploaded artifact names"
    required: true
  summary-prefix:
    description: "Prefix for GitHub step summary titles"
    required: true
  gating-token:
    description: "Clear signing gating token"
    required: true
  solana-rpc-url:
    description: "Solana RPC URL, required by the solana-programs group"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: LedgerHQ/device-sdk-ts/.github/actions/setup-with-cache-composite@b83ec5020b992dcc53f683830e0abd2e147791ae

    # Build only the clear-signing-tester dependency chain, cold. Avoids the
    # slow **/lib build-cache upload/download and the full build:libs.
    - name: Build clear-signing-tester dependencies
      shell: bash
      run: pnpm turbo run build --filter=@ledgerhq/clear-signing-tester...

    - name: Run scenarios
      shell: bash
      env:
        FORCE_COLOR: "0"
        GATING_TOKEN: ${{ inputs.gating-token }}
        INPUT_DEVICE: ${{ inputs.device }}
        INPUT_SCENARIOS: ${{ inputs.scenarios }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_LOG_LEVEL: ${{ inputs.log-level }}
        INPUT_ENABLE_FILE_LOGGING: ${{ inputs.enable-file-logging }}
        INPUT_SOLANA_RPC_URL: ${{ inputs.solana-rpc-url }}
      run: |
        set -o pipefail
        mkdir -p /tmp/logs/screenshots

        ARGS=("--device" "$INPUT_DEVICE" "--concurrency" "$INPUT_CONCURRENCY")

        if [ -n "$INPUT_LOG_LEVEL" ]; then
          ARGS+=("--log-level" "$INPUT_LOG_LEVEL")
        fi

        if [ -n "$INPUT_SOLANA_RPC_URL" ]; then
          ARGS+=("--rpc-url" "$INPUT_SOLANA_RPC_URL")
        fi

        if [ "$INPUT_ENABLE_FILE_LOGGING" = "true" ]; then
          ARGS+=("--log-dir" "/tmp/logs")
          ARGS+=("--file-log-level" "debug")
          ARGS+=("--screenshot-folder-path" "/tmp/logs/screenshots")
        fi

        # Selectors are a space-separated list, so they must word-split.
        read -ra SELECTORS <<< "$INPUT_SCENARIOS"

        pnpm cs-tester cli test "${SELECTORS[@]}" "${ARGS[@]}" 2>&1 \
          | tee /tmp/cs-tester-output.log

    - name: Write job summary
      if: always()
      shell: bash
      env:
        INPUT_SUMMARY_PREFIX: ${{ inputs.summary-prefix }}
        INPUT_DEVICE: ${{ inputs.device }}
        INPUT_SCENARIOS: ${{ inputs.scenarios }}
      run: |
        {
          echo "## ${INPUT_SUMMARY_PREFIX} (${INPUT_DEVICE} - ${INPUT_SCENARIOS})"
          echo ""
          if [ -f /tmp/cs-tester-output.log ]; then
            echo '```'
            sed -n '/SCENARIO RESULTS/,/^└/p' /tmp/cs-tester-output.log
            echo ""
            sed -n '/FAILED SCENARIOS/,/^$/p' /tmp/cs-tester-output.log
            sed -n '/RUN SUMMARY/,/^└/p' /tmp/cs-tester-output.log
            echo '```'
          else
            echo "No test output available"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Sanitise artifact name
      if: always()
      id: artifact
      shell: bash
      env:
        INPUT_ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        INPUT_DEVICE: ${{ inputs.device }}
      run: |
        name=$(echo "${INPUT_ARTIFACT_PREFIX}-${INPUT_DEVICE}" | tr ':/ ' '-')
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: /tmp/logs/
        retention-days: 7
